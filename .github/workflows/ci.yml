name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Setup Zig
      uses: ./.github/actions/setup-zig
    
    - name: Run tests
      run: zig build test
    
    - name: Build project
      run: zig build
    
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: repolicense-${{ matrix.os }}
        path: zig-out/bin/repolicense*

  fmt-check:
    name: Format Check
    runs-on: ubuntu-24.04
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    
    - name: Setup Zig
      uses: ./.github/actions/setup-zig
    
    - name: Check formatting
      run: zig fmt --check src/
